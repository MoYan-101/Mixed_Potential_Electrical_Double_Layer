[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "au-pd-facing-electrolyte-gap"
version = "0.2.0"
description = "Mixed-potential Au/Pd model with facing parallel electrodes and an electrolyte slit"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
au-pd-facing-gap = "au_pd_facing_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
